name: Vérifications mathématiques et physiques

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rubik:
    name: Rubik — ${{ matrix.os }} — Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: rubik_groupes
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Tests du moteur et du serveur local
        run: python -X utf8 -m unittest -v test_cube
  optimisation:
    name: Optimisation — ${{ matrix.os }} — Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: optimisation_distances
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installer NumPy
        run: python -m pip install -r requirements.txt
      - name: Tests des extrema et du serveur local
        run: python -X utf8 -m unittest -v test_mathematiques
  probabilites:
    name: Probabilités — ${{ matrix.os }} — Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: probabilites_cpge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installer NumPy
        run: python -m pip install -r requirements.txt
      - name: Tests des lois, des moments et du serveur local
        run: python -X utf8 -m unittest -v test_mathematiques
  differentiel:
    name: Calcul différentiel — ${{ matrix.os }} — Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: calcul_differentiel
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installer NumPy et le complément SymPy
        run: python -m pip install -r requirements.txt -r requirements-symbolique.txt
      - name: Tests des différentielles, intégrales, groupes et serveur
        run: python -X utf8 -m unittest -v test_mathematiques
      - name: Vérifier le TP symbolique
        run: python -X utf8 tp_symbolique.py
  quantique:
    name: Physique quantique — ${{ matrix.os }} — Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: physique_quantique
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installer NumPy
        run: python -m pip install -r requirements.txt
      - name: Tests des états, des courants, des circuits et du serveur
        run: python -X utf8 -m unittest -v test_modeles test_serveur
  statistique:
    name: Physique statistique — ${{ matrix.os }} — Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: physique_statistique
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installer NumPy
        run: python -m pip install -r requirements.txt
      - name: Tests des états thermiques, de Maxwell, d’Ising et du serveur
        run: python -X utf8 -m unittest -v test_modeles test_ising test_serveur
  algebre:
    name: Algèbre linéaire — ${{ matrix.os }} — Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: algebre_lineaire
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installer NumPy et SymPy
        run: python -m pip install -r requirements.txt
      - name: Tests des invariants, réductions, formes et serveur
        run: python -X utf8 -m unittest -v test_modeles test_reductions test_structures test_applications test_interface test_serveur

  fluides:
    name: Fluides et ondes — ${{ matrix.os }} — Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: mecanique_fluides
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installer NumPy
        run: python -m pip install -r requirements.txt
      - name: Tests des écoulements, des ondes, des bilans et du serveur
        run: python -X utf8 -m unittest -v test_modeles test_pedagogie test_serveur

  electromagnetisme:
    name: Électromagnétisme — ${{ matrix.os }} — Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    defaults:
      run:
        working-directory: electromagnetisme
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installer NumPy
        run: python -m pip install -r requirements.txt
      - name: Tests des champs, ondes, milieux, machines et serveur
        run: python -X utf8 -m unittest -v test_conversion test_ondes test_entree test_pedagogie test_serveur

